apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  interval: 30m
  chart:
    spec:
      chart: longhorn
      version: "1.12.*"
      sourceRef:
        kind: HelmRepository
        name: longhorn
        namespace: longhorn-system
      interval: 12h
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  driftDetection:
    mode: enabled
  values:
    defaultSettings:
      # Réplication : 1 maintenant, passage à 3 quand 3 nœuds
      defaultReplicaCount: 1
      # Chemin de stockage par défaut
      defaultDataPath: /var/lib/longhorn
      # Désactiver l'UI pour économiser la RAM (monitoring via Grafana)
      defaultLonghornStaticStorageClass: longhorn
      # Backup target configuré dans settings.yaml (staging)
      backupTarget: ""
      backupTargetCredentialSecret: ""
      # Créer le StorageClass par défaut
      createDefaultDiskLabeledNodes: false
      # Métriques Prometheus
      registrySecret: ""
    persistence:
      defaultClass: false
      defaultClassReplicaCount: 1
      reclaimPolicy: Retain
    longhornManager:
      resources:
        requests:
          memory: 128Mi
          cpu: 100m
        limits:
          memory: 512Mi
          cpu: 500m
    longhornDriver:
      resources:
        requests:
          memory: 128Mi
          cpu: 100m
        limits:
          memory: 256Mi
          cpu: 500m
    longhornUI:
      replicas: 0
      resources:
        requests:
          memory: 64Mi
          cpu: 50m
        limits:
          memory: 128Mi
          cpu: 200m
    metrics:
      serviceMonitor:
        enabled: true
        labels:
          release: kube-prometheus-stack
