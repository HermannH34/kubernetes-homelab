# migration-pod.yaml - Pod to copy data between PVCs
apiVersion: v1
kind: Pod
metadata:
  name: data-migrator
  namespace: beszel
spec:
  restartPolicy: Never
  containers:
    - name: migrator
      image: alpine:latest
      command:
        - sh
        - -c
        - |
          echo "Starting data migration..."
          # Copy all data from source to destination
          cp -av /source/. /destination/
          echo "Migration complete! Files copied:"
          ls -la /destination/
      volumeMounts:
        - name: source
          mountPath: /source
        - name: destination
          mountPath: /destination
  volumes:
    - name: source
      persistentVolumeClaim:
        claimName: beszel-data # Old PVC
    - name: destination
      persistentVolumeClaim:
        claimName: beszel-data-longhorn # New Longhorn PVC
