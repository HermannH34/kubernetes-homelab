apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: iterato-db
  namespace: iterato
spec:
  instances: 3
  storage:
    size: 1Gi
    storageClass: local-path
  bootstrap:
    initdb:
      database: iterato_production
      owner: iterato
      secret:
        name: iterato-db-app
  backup:
    barmanObjectStore:
      destinationPath: s3://homelab-backup/iterato
      endpointURL: https://b73c406dcde1daffd850e59e7121516f.r2.cloudflarestorage.com
      s3Credentials:
        accessKeyId:
          name: iterato-backup-s3
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: iterato-backup-s3
          key: ACCESS_SECRET_KEY
      wal:
        compression: gzip
      data:
        compression: gzip
