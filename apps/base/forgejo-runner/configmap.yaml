apiVersion: v1
kind: ConfigMap
metadata:
  name: forgejo-runner-config
  namespace: forgejo-runner
data:
  config.yaml: |
    log:
      level: info

    runner:
      file: /data/.runner
      capacity: 1
      timeout: 3h
      insecure: false
      fetch_timeout: 5s
      fetch_interval: 2s
      envs:
        DOCKER_HOST: tcp://localhost:2375
      labels: []

    cache:
      enabled: true
      dir: /data/cache

    container:
      network: ""
      privileged: false
      options:
      workdir_parent: /workspace
      valid_volumes: []
      docker_host: tcp://localhost:2375
